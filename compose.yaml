services:
  mysql:
    image: mysql:8.4
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: localdemo
      MYSQL_DATABASE: legacy
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -plocaldemo --silent"]
      interval: 2s
      timeout: 2s
      retries: 30
